<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>LifeIsTooShort</title>
        <base href="/" />
        <script>
            const fragmentParams = new URLSearchParams(window.location.hash.slice(1));
            const redirect =
                fragmentParams.get('redirect') ??
                new URLSearchParams(window.location.search).get('redirect');

            if (redirect !== null) {
                const basePath = document.querySelector('base').getAttribute('href');

                const restoredUrl = new URL(
                    redirect.replace(/^\/+/, ''),
                    window.location.origin + basePath,
                );

                if (
                    restoredUrl.origin === window.location.origin &&
                    restoredUrl.pathname.startsWith(basePath)
                ) {
                    window.history.replaceState(
                        null,
                        '',
                        restoredUrl.pathname + restoredUrl.search + restoredUrl.hash,
                    );
                }
            }
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    </head>
    <body>
        <!-- [ I'm index.html ] -->
        <app-root></app-root>
    </body>
</html>
