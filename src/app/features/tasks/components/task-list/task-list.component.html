<!-- <pre>{{ debugTasks() | json }}</pre> -->
<ul
    class="list"
    cdkDropList
    [id]="dropListId()"
    [cdkDropListData]="displayTasks()"
    [cdkDropListConnectedTo]="connectedDropLists()"
    [cdkDropListDisabled]="!draggable()"
    [cdkDropListSortingDisabled]="!sortable()"
    [cdkDropListEnterPredicate]="canEnter"
    [cdkDropListSortPredicate]="canSort"
    (cdkDropListDropped)="onDrop($event)"
    >
    @for (task of displayTasks(); track task.id) {
        @if (groupHeaders().get(task.id); as group) {
            <li class="list__group-heading" role="presentation">
                <h3>
                    {{ group.label }}
                    <span class="list__group-count" [attr.aria-label]="group.tasks.length + ' tasks'">{{ group.tasks.length }}</span>
                </h3>
            </li>
        }
        <app-task-row
            [task]="task"
            [projects]="projects()"
            [disabled]="disabled()"
            [draggable]="draggable()"
            (scheduleRequested)="scheduleRequested.emit($event)"
            (toggleDone)="toggleDone.emit($event)"
            (remove)="remove.emit($event)"
            (rename)="rename.emit($event)"
            (editDescription)="editDescription.emit($event)"
            (projectChange)="projectChange.emit($event)"
        />
    } @empty {
        <li class="empty-message">{{ emptyMessage() }}</li>
    }
</ul>
