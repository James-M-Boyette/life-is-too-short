<!-- <pre>{{ debugTasks() | json }}</pre> -->
<ul class="list">
    @for (task of tasks(); track task.id) {
        <app-task-row
            [task]="task"
            [projects]="projects()"
            [disabled]="disabled()"
            (toggleDone)="toggleDone.emit($event)"
            (remove)="remove.emit($event)"
            (rename)="rename.emit($event)"
            (editDescription)="editDescription.emit($event)"
            (projectChange)="projectChange.emit($event)"
            (plannedDateChange)="plannedDateChange.emit($event)"
            (dueDateChange)="dueDateChange.emit($event)"
        />
    } @empty {
        <li class="empty-message">{{ emptyMessage() }}</li>
    }
</ul>
