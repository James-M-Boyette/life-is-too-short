<form class="edit-description-form" [id]="formId()" (submit)="submit($event)" (keydown.escape)="escape($event)">
    <div class="description-heading">
        <label [for]="formId() + '-source'">Description</label>
        <button #helpButton type="button" class="help-button" aria-label="Markdown help"
            pTooltip="Markdown help" tooltipPosition="bottom" aria-haspopup="dialog"
            [attr.aria-expanded]="!!help.overlayVisible" (click)="help.toggle($event)">
            <i class="pi pi-question-circle" aria-hidden="true"></i>
        </button>
    </div>
    <textarea #textarea [id]="formId() + '-source'" rows="6" [value]="draft()" (input)="onInput($event)"
        [disabled]="disabled() || pending()"></textarea>
    @if (pending()) { <p role="status">Saving description…</p> }
    @if (error(); as message) { <p role="alert">{{ message }} Your draft is still here; choose Save to retry.</p> }
</form>
<p-popover #help appendTo="body" ariaLabel="Markdown formatting">
    <div class="markdown-help" (keydown.escape)="$event.preventDefault(); $event.stopPropagation(); closeHelp()">
        <header><strong>Markdown formatting</strong>
            <button type="button" class="help-button" aria-label="Close Markdown help" (click)="closeHelp()"><i class="pi pi-times" aria-hidden="true"></i></button>
        </header>
        <dl>
            <div><dt><strong>Bold</strong></dt><dd><code>**text**</code></dd></div>
            <div><dt><em>Italic</em></dt><dd><code>*text*</code></dd></div>
            <div><dt><ul><li>Bulleted list</li></ul></dt><dd><code>- Item</code></dd></div>
            <div><dt><ol><li>Numbered list</li></ol></dt><dd><code>1. Item</code></dd></div>
            <div><dt><span class="link-example">Link</span></dt><dd><code>[text](url)</code></dd></div>
            <div><dt><code>Inline code</code></dt><dd><code>`code`</code></dd></div>
        </dl>
    </div>
</p-popover>
