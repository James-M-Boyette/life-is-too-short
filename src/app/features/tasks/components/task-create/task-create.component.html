<form id="create-task-form" class="create-new-task-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="task-content">
        <input
            type="text"
            name="task-title"
            placeholder="Add a task …"
            formControlName="title"
            [disabled]="disabled()"
        />

        <textarea
            rows="2"
            cols="30"
            pTextarea
            [autoResize]="false"
            placeholder="Enter a description for this task ..."
            formControlName="description"
            [disabled]="disabled()"
        ></textarea>
    </div>

    <footer class="task-actions">
        <p-treeselect
            class="assign-to-project-dropdown"
            [options]="projectOptions()"
            placeholder="Select a Project"
            formControlName="project"
            [showClear]="true"
            [disabled]="disabled()"
            appendTo="body"
        />

        <p-datepicker
            formControlName="plannedDate"
            [showIcon]="true"
            iconDisplay="input"
            [showClear]="true"
            [disabled]="disabled()"
            appendTo="body"
            dateFormat="M d, yy"
            placeholder="Planned date"
        />

        <div class="action-buttons-container">
            <button pButton type="button" (click)="onCancelCreateTask()" [disabled]="disabled()">
                <i class="pi pi-times" pButtonIcon></i>
                <span pButtonLabel>Cancel</span>
            </button>

            <button pButton type="submit" [disabled]="form.invalid || disabled()">
                <i class="pi pi-plus" pButtonIcon></i>
                <span pButtonLabel>Add Task</span>
            </button>
        </div>
    </footer>
</form>
