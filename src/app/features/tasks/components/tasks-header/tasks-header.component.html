<header class="top">
    <h1>{{ title }}</h1>

    @if (showRealtimeDiagnostic) {
        <div class="right">
            <small class="status">Realtime: {{ realtimeOn ? 'on' : 'off' }}</small>
        </div>
    }
    <div class="heading-actions">
        <ng-content select="[page-actions]" />
    </div>

</header>

@if (errorText) {
    <p class="error" role="alert">{{ errorText }}</p>
}
