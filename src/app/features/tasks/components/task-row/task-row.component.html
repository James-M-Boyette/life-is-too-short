<li
    class="row"
    cdkDrag
    [cdkDragData]="task()"
    [cdkDragDisabled]="!draggable() || disabled() || editing() || editingDescription()"
    >
    <section class="task-primary-section">
        <div class="left-column">
            @if (draggable()) {
                <button
                    type="button"
                    class="task-drag-handle"
                    cdkDragHandle
                    [disabled]="disabled()"
                    [attr.aria-label]="'Drag task: ' + task().title"
                    pTooltip="Drag to schedule"
                    tooltipPosition="bottom"
                >
                    <i class="pi pi-bars" aria-hidden="true"></i>
                </button>
            }
            <button
                type="button"
                class="complete-toggle"
                [class.done]="task().is_done"
                (click)="toggleDone.emit(task())"
                [disabled]="disabled()"
                [attr.aria-label]="task().is_done ? 'Mark task not done' : 'Mark task done'"
                [attr.aria-pressed]="task().is_done"
                >
                <span class="sr-only">
                    {{ task().is_done ? 'Completed' : 'Not completed' }}
                </span>
            </button>

            @if (!editing()) {
                <button
                    type="button"
                    #titleButton class="title-btn"
                    [class.done]="task().is_done"
                    (click)="startEdit()"
                    [disabled]="disabled()"
                    aria-label="Edit task title"
                    >
                    <!-- *TASK TITLE* -->
                    {{ task().title }}
                </button>
            } @else {
                <form
                    class="edit-title-form" [id]="'title-form-' + task().id"
                    (keydown.escape)="$event.stopPropagation(); cancelEdit()"
                    (submit)="onSubmit($event)"
                    >
                    <input
                        #titleInput type="text"
                        [value]="draftTitle()"
                        (input)="onDraftInput($event)"
                        [disabled]="disabled()"
                        aria-label="Task title"
                    />

                </form>
            }
        </div>

        <div class="task-actions">
            <button
                pButton
                type="button"
                class="task-action-btn schedule-task-btn"
                pTooltip="Schedule task"
                tooltipPosition="bottom"
                aria-label="Schedule task"
                aria-haspopup="dialog"
                [disabled]="disabled()"
                [attr.data-schedule-task-id]="task().id"
                (click)="openSchedule($event)"
                >
                <i class="pi pi-calendar-clock" aria-hidden="true"></i>
            </button>

            <button #moreActionsButton pButton [text]="true" type="button" class="task-action-btn more-actions-btn"
                pTooltip="More actions" tooltipPosition="bottom"
                [attr.aria-label]="'More actions for ' + task().title" aria-haspopup="menu"
                [attr.aria-controls]="'task-actions-' + task().id"
                [attr.aria-expanded]="!!actionsMenu.visible" [disabled]="disabled()"
                (click)="openActions($event)" (keydown.arrowdown)="openActionsWithKeyboard($event)">
                <i class="pi pi-ellipsis-h" aria-hidden="true"></i>
            </button>
            <p-menu #actionsMenu [id]="'task-actions-' + task().id" [model]="menuItems()"
                [popup]="true" appendTo="body" [ariaLabel]="'Actions for ' + task().title" />
        </div>
    </section>

    <section class="task-secondary-section">
        <div class="description">
            @if (editingDescription()) {
                <app-task-description-editor [source]="task().description ?? ''" [formId]="'description-form-' + task().id"
                    [disabled]="disabled()" [pending]="!!descriptionFeedback()?.pending" [error]="descriptionError()"
                    (saved)="commitDescriptionEdit($event)" (cancelled)="cancelDescriptionEdit()" />
            } @else {
                @if (task().description; as description) {
                    <app-task-description [source]="description" [taskId]="task().id" [editable]="!disabled()" (editRequested)="startDescriptionEdit()" />
                }
            }
        </div>
        <div class="meta-row">
            <div class="meta">
                <p-treeselect
                    [options]="projectOptions()"
                    [ngModel]="selectedProjectNode()"
                    (ngModelChange)="onProjectChange($event)"
                    placeholder="No Project"
                    [showClear]="true"
                />

                <div class="task-date-tags">
                    @if (plannedDate(); as date) {
                        <p-tag
                            severity="secondary"
                            [value]="'Planned: ' + (date | date: 'MMM d')"
                            icon="pi pi-calendar"
                        />
                    }

                    @if (dueDate(); as date) {
                        <p-tag
                            [severity]="isDueOverdue() ? 'danger' : 'secondary'"
                            [value]="'Due: ' + (date | date: 'MMM d')"
                            icon="pi pi-flag"
                        />
                    }
                </div>
            </div>
            @if (editing()) {
                <div class="edit-actions" role="group" aria-label="Title editing actions">
                    <button pButton type="button" [text]="true" class="edit-icon-button" aria-label="Cancel editing task title"
                        pTooltip="Cancel editing title" tooltipPosition="bottom" (click)="cancelEdit()" [disabled]="disabled()"><i class="pi pi-times" aria-hidden="true"></i></button>
                    <button pButton type="submit" [attr.form]="'title-form-' + task().id" class="edit-icon-button" aria-label="Save task title"
                        pTooltip="Save task title" tooltipPosition="bottom" [disabled]="disabled()"><i class="pi pi-check" aria-hidden="true"></i></button>
                </div>
            }
            @if (editingDescription()) {
                <div class="edit-actions" role="group" aria-label="Description editing actions">
                    <button pButton type="button" [text]="true" class="edit-icon-button" aria-label="Cancel editing description"
                        pTooltip="Cancel editing description" tooltipPosition="bottom" (click)="cancelDescriptionEdit()"
                        [disabled]="!!descriptionFeedback()?.pending"><i class="pi pi-times" aria-hidden="true"></i></button>
                    <button pButton type="submit" [attr.form]="'description-form-' + task().id" class="edit-icon-button" aria-label="Save description"
                        pTooltip="Save description" tooltipPosition="bottom" [disabled]="disabled() || !!descriptionFeedback()?.pending"><i class="pi pi-check" aria-hidden="true"></i></button>
                </div>
            }
        </div>
    </section>
</li>
