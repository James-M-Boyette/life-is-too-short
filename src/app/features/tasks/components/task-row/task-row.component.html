<!-- Todo:
    [x] Allow a user to change a task's project once it's been created (or unassign it entirely from any project)
    [] Currently, if a task title (see *TASK TITLE*) is too long, the first part is clipped; decide how to handle this better
    [] 'View Description' button is too big. Maybe have 'eye' icon only?
    [] 'Delete' button is too big. Maybe have 'trash' icon only? + add confirmation dialog (and eventually have a toggle that's project-speicifc for safe vs unsafe CRUD? Or use an 'undo' pattern instead of a confiramtion dialog)
-->
<li
    class="row"
    cdkDrag
    [cdkDragData]="task()"
    [cdkDragDisabled]="!draggable() || disabled() || editing() || editingDescription()"
    >
    <section class="task-primary-section">
        <div class="left-column">
            @if (draggable()) {
                <button
                    type="button"
                    class="task-drag-handle"
                    cdkDragHandle
                    [disabled]="disabled()"
                    [attr.aria-label]="'Drag task: ' + task().title"
                    pTooltip="Drag to schedule"
                    tooltipPosition="bottom"
                >
                    <i class="pi pi-bars" aria-hidden="true"></i>
                </button>
            }
            <button
                type="button"
                class="complete-toggle"
                [class.done]="task().is_done"
                (click)="toggleDone.emit(task())"
                [disabled]="disabled()"
                [attr.aria-label]="task().is_done ? 'Mark task not done' : 'Mark task done'"
                [attr.aria-pressed]="task().is_done"
                >
                <span class="sr-only">
                    {{ task().is_done ? 'Completed' : 'Not completed' }}
                </span>
            </button>

            @if (!editing()) {
                <button
                    type="button"
                    class="title-btn"
                    [class.done]="task().is_done"
                    (click)="startEdit()"
                    [disabled]="disabled()"
                    aria-label="Edit task title"
                    >
                    <!-- *TASK TITLE* -->
                    {{ task().title }}
                </button>
            } @else {
                <form
                    class="edit-title-form"
                    (submit)="onSubmit($event)"
                    >
                    <input
                        type="text"
                        [value]="draftTitle()"
                        (input)="onDraftInput($event)"
                        [disabled]="disabled()"
                        aria-label="Task title"
                        autofocus
                    />

                    <div class="edit-title-actions">
                        <button
                            type="submit"
                            class="task-action-btn"
                            pTooltip="Save title"
                            tooltipPosition="bottom"
                            aria-label="Save task title"
                            [disabled]="disabled()"
                        >
                            <i
                                class="pi pi-check"
                                aria-hidden="true"
                            ></i>
                        </button>

                        <button
                            type="button"
                            class="task-action-btn"
                            pTooltip="Cancel editing"
                            tooltipPosition="bottom"
                            aria-label="Cancel editing task title"
                            (click)="cancelEdit()"
                            [disabled]="disabled()"
                        >
                            <i
                                class="pi pi-times"
                                aria-hidden="true"
                            ></i>
                        </button>
                    </div>
                </form>
            }
        </div>

        <div class="task-actions">
            <button
                pButton
                type="button"
                class="task-action-btn schedule-task-btn"
                pTooltip="Schedule task"
                tooltipPosition="bottom"
                aria-label="Schedule task"
                aria-haspopup="dialog"
                [disabled]="disabled()"
                (click)="schedulePopover.toggle($event)"
                >
                <i class="pi pi-calendar-clock" aria-hidden="true"></i>
            </button>

            <button
                pButton
                type="button"
                class="task-action-btn delete-task-btn"
                pTooltip="Delete task"
                tooltipPosition="bottom"
                aria-label="Delete task"
                (click)="remove.emit(task().id)"
                [disabled]="disabled()"
                >
                <i
                    class="pi pi-trash"
                    aria-hidden="true"
                ></i>
            </button>
        </div>
    </section>

    <section class="task-secondary-section">
        <div class="description">
            @if (editingDescription()) {
                <form
                    class="edit-description-form"
                    (submit)="onDescriptionSubmit($event)"
                >
                    ...
                </form>
            } @else if (task().description) {
                <p class="description-text">
                    {{ task().description }}
                </p>
            }
        </div>
        <div class="meta">
            <p-treeselect
                [options]="projectOptions()"
                [ngModel]="selectedProjectNode()"
                (ngModelChange)="onProjectChange($event)"
                placeholder="No Project"
                [showClear]="true"
            />

            <div class="task-date-tags">
                @if (plannedDate(); as date) {
                    <p-tag
                        severity="secondary"
                        [value]="'Planned: ' + (date | date: 'MMM d')"
                        icon="pi pi-calendar"
                    />
                }

                @if (dueDate(); as date) {
                    <p-tag
                        [severity]="isDueOverdue() ? 'danger' : 'secondary'"
                        [value]="'Due: ' + (date | date: 'MMM d')"
                        icon="pi pi-flag"
                    />
                }
            </div>
        </div>
    </section>
</li>

<p-popover #schedulePopover>
    <div class="schedule-popover">
        <h3>Schedule task</h3>

        <div class="schedule-field">
            <label [for]="'planned-date-' + task().id">
                Planned date
            </label>

            <p-datepicker
                [inputId]="'planned-date-' + task().id"
                [ngModel]="plannedDate()"
                (ngModelChange)="onPlannedDateChange($event)"
                placeholder="Choose planned date"
                dateFormat="M d, yy"
                [showIcon]="true"
                [showClear]="true"
                [showOnFocus]="false"
                [disabled]="disabled()"
            />
        </div>

        <div class="schedule-field">
            <label [for]="'due-date-' + task().id">
                Due date
            </label>

            <p-datepicker
                [inputId]="'due-date-' + task().id"
                [ngModel]="dueDate()"
                (ngModelChange)="onDueDateChange($event)"
                placeholder="Choose due date"
                dateFormat="M d, yy"
                [showIcon]="true"
                [showClear]="true"
                [showOnFocus]="false"
                [disabled]="disabled()"
            />
        </div>
    </div>
</p-popover>
