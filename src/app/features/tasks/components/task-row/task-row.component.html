<li class="row" cdkDrag [cdkDragData]="task()" [cdkDragDisabled]="!draggable() || disabled() || editing()">
    <ng-template #leading>
            @if (draggable()) {
                <button
                    type="button"
                    class="task-drag-handle"
                    cdkDragHandle
                    [disabled]="disabled() || editing()"
                    [attr.aria-label]="'Drag task: ' + task().title"
                    pTooltip="Drag to schedule"
                    tooltipPosition="bottom"
                >
                    <i class="pi pi-bars" aria-hidden="true"></i>
                </button>
            }
            <button
                type="button"
                class="complete-toggle"
                [class.done]="task().is_done"
                (click)="toggleDone.emit(task())"
                [disabled]="disabled() || editing()"
                [attr.aria-label]="task().is_done ? 'Mark task not done' : 'Mark task done'"
                [attr.aria-pressed]="task().is_done"
                >
                <span class="sr-only">
                    {{ task().is_done ? 'Completed' : 'Not completed' }}
                </span>
            </button>

    </ng-template>
    <ng-template #actions>
            @if (!editing()) {
            <button #pencilButton pButton [text]="true" type="button" class="task-action-btn edit-task-btn"
                aria-label="Edit task" pTooltip="Edit task" tooltipPosition="bottom" [disabled]="disabled() || editing()"
                (click)="startEdit('title', 'pencil')"><i class="pi pi-pencil" aria-hidden="true"></i></button>
            }
            <button
                pButton
                type="button"
                class="task-action-btn schedule-task-btn"
                pTooltip="Schedule task"
                tooltipPosition="bottom"
                aria-label="Schedule task"
                aria-haspopup="dialog"
                [disabled]="disabled() || editing()"
                [attr.data-schedule-task-id]="task().id"
                (click)="openSchedule($event)"
                >
                <i class="pi pi-calendar-clock" aria-hidden="true"></i>
            </button>

            <button #moreActionsButton pButton [text]="true" type="button" class="task-action-btn more-actions-btn"
                pTooltip="More actions" tooltipPosition="bottom"
                [attr.aria-label]="'More actions for ' + task().title" aria-haspopup="menu"
                [attr.aria-controls]="'task-actions-' + task().id"
                [attr.aria-expanded]="!!actionsMenu.visible" [disabled]="disabled()"
                (click)="openActions($event)" (keydown.arrowdown)="openActionsWithKeyboard($event)">
                <i class="pi pi-ellipsis-h" aria-hidden="true"></i>
            </button>
            <p-menu #actionsMenu [id]="'task-actions-' + task().id" [model]="menuItems()"
                [popup]="true" appendTo="body" [ariaLabel]="'Actions for ' + task().title" />
    </ng-template>
    <ng-template #metadata>
            <div class="meta">
                <p-treeselect
                    [disabled]="disabled() || editing()"
                    [options]="projectOptions()"
                    [ngModel]="selectedProjectNode()"
                    (ngModelChange)="onProjectChange($event)"
                    placeholder="No Project"
                    [showClear]="true"
                />

                <div class="task-date-tags">
                    @if (plannedDate(); as date) {
                        <p-tag
                            severity="secondary"
                            [value]="'Planned: ' + (date | date: 'MMM d')"
                            icon="pi pi-calendar"
                        />
                    }

                    @if (dueDate(); as date) {
                        <p-tag
                            [severity]="isDueOverdue() ? 'danger' : 'secondary'"
                            [value]="'Due: ' + (date | date: 'MMM d')"
                            icon="pi pi-flag"
                        />
                    }
                </div>
            </div>
    </ng-template>
    @if (editing()) {
        <app-task-content-editor [content]="task()" [taskId]="task().id" [initialFocus]="initialFocus()"
            [disabled]="disabled()" [pending]="!!contentFeedback()?.pending" [error]="contentError()"
            (saved)="saveContent($event)" (cancelled)="cancelEdit()">
            <ng-container taskLeading [ngTemplateOutlet]="leading" />
            <div taskActions class="task-actions"><ng-container [ngTemplateOutlet]="actions" /></div>
            <ng-container taskMetadata [ngTemplateOutlet]="metadata" />
        </app-task-content-editor>
    } @else {
        <section class="task-primary-section">
            <div class="left-column">
                <ng-container [ngTemplateOutlet]="leading" />
                <button #titleButton type="button" class="title-btn" [class.done]="task().is_done"
                    (click)="startEdit('title', 'title')" [disabled]="disabled()" aria-label="Edit task title">{{ task().title }}</button>
            </div>
            <div class="task-actions"><ng-container [ngTemplateOutlet]="actions" /></div>
        </section>
        <section class="task-secondary-section">
            @if (task().description; as description) {
                <div class="description">
                    <app-task-description [source]="description" [taskId]="task().id" [editable]="!disabled()"
                        (editRequested)="startEdit('description')" />
                </div>
            }
            <div class="meta-row"><ng-container [ngTemplateOutlet]="metadata" /></div>
        </section>
    }
</li>
