<!-- Todo:
    [x] Allow a user to change a task's project once it's been created (or unassign it entirely from any project)
    [] Currently, if a task title (see *TASK TITLE*) is too long, the first part is clipped; decide how to handle this better
    [] 'View Notes' button is too big. Maybe have 'eye' icon only?
    [] 'Delete' button is too big. Maybe have 'trash' icon only? + add confirmation dialog (and eventually have a toggle that's project-speicifc for safe vs unsafe CRUD? Or use an 'undo' pattern instead of a confiramtion dialog)
-->
<li class="row">
    <section class="task-primary-section">
        <div class="left-column">
            <button
                type="button"
                class="complete-toggle"
                [class.done]="task().is_done"
                (click)="toggleDone.emit(task())"
                [disabled]="disabled()"
                [attr.aria-label]="task().is_done ? 'Mark task not done' : 'Mark task done'"
                [attr.aria-pressed]="task().is_done"
            >
                <span class="sr-only">
                    {{ task().is_done ? 'Completed' : 'Not completed' }}
                </span>
            </button>

            @if (!editing()) {
                <button
                    type="button"
                    class="title-btn"
                    [class.done]="task().is_done"
                    (click)="startEdit()"
                    [disabled]="disabled()"
                    aria-label="Edit task title"
                >
                    <!-- *TASK TITLE* -->
                    {{ task().title }}
                </button>
            } @else {
                <!-- <form class="edit" (submit)="onSubmit($event)">
                    <input
                        type="text"
                        [value]="draftTitle()"
                        (input)="onDraftInput($event)"
                        [disabled]="disabled()"
                        autofocus
                    />
                    <button type="submit" [disabled]="disabled()">Save</button>
                    <button type="button" (click)="cancelEdit()" [disabled]="disabled()">
                        Cancel
                    </button>
                </form> -->
                <form
                    class="edit-title-form"
                    (submit)="onSubmit($event)"
                    >
                    <input
                        type="text"
                        [value]="draftTitle()"
                        (input)="onDraftInput($event)"
                        [disabled]="disabled()"
                        aria-label="Task title"
                        autofocus
                    />

                    <div class="edit-title-actions">
                        <button
                            type="submit"
                            class="task-action-btn"
                            pTooltip="Save title"
                            tooltipPosition="bottom"
                            aria-label="Save task title"
                            [disabled]="disabled()"
                        >
                            <i
                                class="pi pi-check"
                                aria-hidden="true"
                            ></i>
                        </button>

                        <button
                            type="button"
                            class="task-action-btn"
                            pTooltip="Cancel editing"
                            tooltipPosition="bottom"
                            aria-label="Cancel editing task title"
                            (click)="cancelEdit()"
                            [disabled]="disabled()"
                        >
                            <i
                                class="pi pi-times"
                                aria-hidden="true"
                            ></i>
                        </button>
                    </div>
                </form>
            }
        </div>

        <button
            pButton
            type="button"
            class="task-action-btn delete-task-btn"
            pTooltip="Delete task"
            tooltipPosition="bottom"
            aria-label="Delete task"
            (click)="remove.emit(task().id)"
            [disabled]="disabled()"
            >
            <i
                class="pi pi-trash"
                aria-hidden="true"
            ></i>
        </button>
    </section>

    <section class="task-secondary-section">
        <div class="meta">
            <p-treeselect
                [options]="projectOptions()"
                [ngModel]="selectedProjectNode()"
                (ngModelChange)="onProjectChange($event)"
                placeholder="No Project"
                [showClear]="true"
            />

            <!-- <button
                pButton
                type="button"
                class="task-action-btn notes-toggle-btn"
                [pTooltip]="notesOpen() ? 'Hide notes' : 'View notes'"
                tooltipPosition="bottom"
                [attr.aria-label]="notesOpen() ? 'Hide task notes' : 'View task notes'"
                [attr.aria-expanded]="notesOpen()"
                (click)="toggleNotesOpen()"
                [disabled]="disabled()"
            >
                <i
                    [class]="notesOpen() ? 'pi pi-eye-slash' : 'pi pi-eye'"
                    aria-hidden="true"
                ></i>
            </button> -->
        </div>

        @if (notesOpen()) {
            <div class="notes">
                @if (!editingNotes()) {
                    <div class="notes-view">
                        <p class="notes-text">{{ task().notes ?? 'No notes yet.' }}</p>
                        <button type="button" (click)="startNotesEdit()" [disabled]="disabled()">
                            Edit notes
                        </button>
                    </div>
                } @else {
                    <form class="edit-notes-form" (submit)="onNotesSubmit($event)">
                        <textarea
                            rows="3"
                            [value]="draftNotes()"
                            (input)="onNotesInput($event)"
                            [disabled]="disabled()"
                        ></textarea>
                        <div class="notes-actions">
                            <button type="submit" [disabled]="disabled()">Save</button>
                            <button
                                type="button"
                                (click)="cancelNotesEdit()"
                                [disabled]="disabled()"
                            >
                                Cancel
                            </button>
                        </div>
                    </form>
                }
            </div>
        }
    </section>
</li>
