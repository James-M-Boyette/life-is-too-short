<form
    id="project-editor-form"
    class="project-editor-form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()">
    <div class="form-field">
        <label for="project-name">Project name</label>

        <input
            id="project-name"
            type="text"
            formControlName="name"
            placeholder="e.g. 3D Modeling" />

        @if (form.controls.name.touched && form.controls.name.invalid) {
            <small class="field-error"> Project name is required. </small>
        }
    </div>

    <div class="form-field">
        <label for="parent-project">Parent project</label>

        <p-treeselect
            inputId="parent-project"
            [options]="projectOptions()"
            formControlName="parentProject"
            placeholder="None (top-level project)"
            [showClear]="true"
            [pt]="{
                hiddenInput: {
                    'aria-describedby': form.controls.parentProject.invalid
                        ? 'parent-project-error'
                        : undefined,
                    'aria-invalid': form.controls.parentProject.invalid,
                },
            }"
            appendTo="body" />
        @if (form.controls.parentProject.hasError('unavailableParent')) {
            <small id="parent-project-error" class="field-error" role="alert">
                The selected parent is no longer available. Choose another parent or clear the
                selection.
            </small>
        }
    </div>

    <footer class="form-actions">
        <button
            pButton
            type="button"
            severity="secondary"
            [outlined]="true"
            [disabled]="disabled()"
            (click)="cancel.emit()">
            <span pButtonLabel>Cancel</span>
        </button>

        <button pButton type="submit" [disabled]="form.invalid || disabled()">
            <span pButtonLabel>{{ isEditing() ? 'Save Changes' : 'Create Project' }}</span>
        </button>
    </footer>
</form>
