<header class="app-top-bar">
    <div class="left">
        <div class="brand">
            <span class="app-name">
                Life is too short
            </span>
        </div>
    </div>

    <div class="right">
        @if (userEmail()) {
            <span class="user-email">
                {{ userEmail() }}
            </span>
        }

        <button
            pButton
            type="button"
            (click)="signOut.emit()"
            >
            <i class="pi pi-sign-out" pButtonIcon></i>
            <span pButtonLabel>Sign Out</span>
        </button>
    </div>
</header>
