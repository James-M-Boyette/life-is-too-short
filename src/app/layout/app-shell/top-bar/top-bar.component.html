<header class="app-top-bar">
    <div class="left">
        @if (mobile()) {
            <button type="button" class="icon-button" aria-label="Show navigation" aria-controls="mobile-navigation"
                [attr.aria-expanded]="navigationOpen()" (click)="showNavigation.emit()"><i class="pi pi-bars" aria-hidden="true"></i></button>
        }
        <span class="app-name">Life is too short</span>
    </div>
    @if (mobile()) {
        <button type="button" class="icon-button" aria-label="Add task" (click)="createTask.emit()"><i class="pi pi-plus" aria-hidden="true"></i></button>
    } @else {
        <app-account-controls [userEmail]="userEmail()" (signOut)="signOut.emit()" />
    }
</header>
