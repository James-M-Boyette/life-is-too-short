<nav class="sidebar-navigation">
    <section class="focus-navigation">
        <button type="button">
            <i class="pi pi-plus"></i>
            Add Task
        </button>

        <a
            routerLink="/tasks"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
        >
            All Tasks
        </a>
        <a
            routerLink="/tasks/inbox"
            routerLinkActive="active"
            >
            Inbox
        </a>

        <a
            routerLink="/tasks/today"
            routerLinkActive="active"
        >
            Today
        </a>

        <a
            routerLink="/tasks/upcoming"
            routerLinkActive="active"
        >
            Upcoming
        </a>
    </section>

    <section class="project-navigation">
        <h2>Projects</h2>

        <div class="project-tree-actions">
            <button
                type="button"
                (click)="expandAll()"
            >
                Expand all
            </button>

            <button
                type="button"
                (click)="collapseAll()"
            >
                Collapse all
            </button>
        </div>

        <p-tree [value]="projectNodes()">
            <ng-template
                pTemplate="default"
                let-node
            >
                <a
                    [routerLink]="['/tasks/project', node.key]"
                    routerLinkActive="active"
                >
                    {{ node.label }}
                </a>
            </ng-template>
        </p-tree>
    </section>
</nav>
