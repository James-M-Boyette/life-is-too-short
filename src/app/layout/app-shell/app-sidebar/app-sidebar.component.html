<nav class="sidebar-navigation">
    <section class="focus-navigation">
        <button type="button">
            <i class="pi pi-plus"></i>

        <button type="button">Upcoming</button>

    <section class="project-navigation">

        @for (node of projects(); track node.project.id) {

            <a
                [routerLink]="['/tasks/project', node.project.id]"
                routerLinkActive="active">
                {{ node.project.name }}

            </a>

        }
    </section>
