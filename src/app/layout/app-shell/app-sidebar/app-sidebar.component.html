<nav class="sidebar-navigation">
    <section class="focus-navigation">
        <button type="button" (click)="createTask.emit()">
            <i class="pi pi-plus" aria-hidden="true"></i>
            Add Task
        </button>

        <a
            (click)="onNavigationClick($event)" routerLink="/tasks"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            pTooltip="A comprehensive view across every project, including unassigned tasks"
            tooltipPosition="bottom"
        >
            All Tasks
        </a>
        <a
            (click)="onNavigationClick($event)" routerLink="/tasks/inbox"
            routerLinkActive="active"
            pTooltip="Start here: tasks that haven't been assigned a project or due date yet"
            tooltipPosition="bottom"
        >
            Inbox
        </a>

        <a (click)="onNavigationClick($event)" routerLink="/tasks/today" routerLinkActive="active"> Today </a>

        <a (click)="onNavigationClick($event)" routerLink="/tasks/upcoming" routerLinkActive="active"> Upcoming </a>
    </section>

    <section class="project-navigation">
        <!-- <h2>Projects</h2> -->
        <header class="project-navigation-header">
            <h2>Projects</h2>

            <button
                type="button"
                class="add-project-btn"
                pTooltip="Create project"
                tooltipPosition="bottom"
                aria-label="Create a project"
                (click)="createProject.emit()"
            >
                <i class="pi pi-plus" aria-hidden="true"></i>
            </button>
        </header>

        <div class="project-tree-actions">
            <button type="button" (click)="expandAll()">Expand all</button>

            <button type="button" (click)="collapseAll()">Collapse all</button>
        </div>

        <p-tree
            [value]="projectNodes()"
            (onNodeExpand)="onNodeExpand($event)"
            (onNodeCollapse)="onNodeCollapse($event)"
        >
            <ng-template pTemplate="default" let-node>
                <div class="project-tree-item">
                    <a (click)="onNavigationClick($event)" (keydown)="onProjectControlKeydown($event)"
                        [routerLink]="['/tasks/project', node.key]" routerLinkActive="active"
                        ariaCurrentWhenActive="page">
                        <span>{{ node.label }}</span>
                    </a>
                    <button type="button" class="project-more" aria-haspopup="menu" aria-controls="sidebar-project-actions"
                        [attr.aria-label]="'More actions for ' + node.label" [pTooltip]="'More actions for ' + node.label"
                        [attr.aria-expanded]="menuOpen() && selectedProjectId() === node.key"
                        (keydown)="onProjectControlKeydown($event)" (click)="openProjectMenu($event, node.key)">
                        <i class="pi pi-ellipsis-h" aria-hidden="true"></i>
                    </button>
                    @if (node.children?.length) {
                        <button type="button" class="project-toggle"
                            [attr.aria-label]="(node.expanded ? 'Collapse ' : 'Expand ') + node.label"
                            [attr.aria-expanded]="!!node.expanded"
                            (keydown)="onProjectControlKeydown($event)"
                            (click)="$event.stopPropagation(); toggleProjectChildren(node)">
                            <i [class]="node.expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'" aria-hidden="true"></i>
                        </button>
                    }
                </div>
            </ng-template>
        </p-tree>
    </section>
</nav>

<p-menu #projectMenu id="sidebar-project-actions" [model]="menuItems" [popup]="true"
    [appendTo]="overlayParent()" ariaLabel="Project actions" (onShow)="menuShown()" (onHide)="menuHidden()" />
