<nav class="sidebar-navigation">
    <section class="focus-navigation">
        <button type="button">
            <i class="pi pi-plus"></i>
            Add Task
        </button>

        <a
            routerLink="/tasks"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            pTooltip="A comprehensive view across every project, including unassigned tasks"
            tooltipPosition="bottom"
        >
            All Tasks
        </a>
        <a
            routerLink="/tasks/inbox"
            routerLinkActive="active"
            pTooltip="Start here: tasks that haven't been assigned a project or due date yet"
            tooltipPosition="bottom"
        >
            Inbox
        </a>

        <a
            routerLink="/tasks/today"
            routerLinkActive="active"
        >
            Today
        </a>

        <a
            routerLink="/tasks/upcoming"
            routerLinkActive="active"
        >
            Upcoming
        </a>
    </section>

    <section class="project-navigation">
        <!-- <h2>Projects</h2> -->
        <header class="project-navigation-header">
            <h2>Projects</h2>

            <button
                type="button"
                class="add-project-btn"
                pTooltip="Create project"
                tooltipPosition="bottom"
                aria-label="Create a project"
                (click)="createProject.emit()"
            >
                <i class="pi pi-plus" aria-hidden="true"></i>
            </button>
        </header>

        <div class="project-tree-actions">
            <button
                type="button"
                (click)="expandAll()"
            >
                Expand all
            </button>

            <button
                type="button"
                (click)="collapseAll()"
            >
                Collapse all
            </button>
        </div>

        <p-tree
            [value]="projectNodes()"
            (onNodeExpand)="onNodeExpand($event)"
            (onNodeCollapse)="onNodeCollapse($event)"
        >
            <ng-template pTemplate="default" let-node>
                <div class="project-tree-item">
                    <a
                        [routerLink]="['/tasks/project', node.key]"
                        routerLinkActive="active"
                    >
                        {{ node.label }}
                    </a>

                    <div class="action-buttons-container">
                        <button
                            type="button"
                            class="edit-project-btn"
                            [attr.aria-label]="'Edit ' + node.label"
                            (click)="editProject.emit(node.key)"
                        >
                            <i class="pi pi-pencil" aria-hidden="true"></i>
                        </button>
                        <button
                            type="button"
                            class="delete-project-btn"
                            [attr.aria-label]="'Delete ' + node.label"
                            (click)="deleteProject.emit(node.key)"
                        >
                            <i class="pi pi-trash" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </ng-template>
        </p-tree>
    </section>
</nav>
