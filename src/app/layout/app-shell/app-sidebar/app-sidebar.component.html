<nav class="sidebar-navigation">
    <section class="focus-navigation">
        <button type="button">
            <i class="pi pi-plus"></i>
            Add Task
        </button>

        <a
            routerLink="/tasks/inbox"
            routerLinkActive="active"
            >
            Inbox
        </a>

        <a
            routerLink="/tasks/today"
            routerLinkActive="active"
        >
            Today
        </a>

        <a
            routerLink="/tasks/upcoming"
            routerLinkActive="active"
        >
            Upcoming
        </a>
    </section>

    <section class="project-navigation">
        <h2>Projects</h2>

        @for (node of projects(); track node.project.id) {
            <!-- (click)="projectSelect.emit(node.project.id)" -->

            <a
                [routerLink]="['/tasks/project', node.project.id]"
                routerLinkActive="active">
                {{ node.project.name }}

            </a>

        }
    </section>
</nav>
