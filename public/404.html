<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Redirecting...</title>
        <script>
            const basePath = '/life-is-too-short/';
            const currentPath = window.location.pathname;

            if (currentPath.startsWith(basePath)) {
                const route = currentPath.slice(basePath.length);
                const search = window.location.search;
                const hash = window.location.hash;

                const redirectUrl = new URL(basePath, window.location.origin);

                // Auth callback fragments may contain session tokens. Keep
                // the handoff out of the HTTP request to the app root.
                redirectUrl.hash = new URLSearchParams({ redirect: route + search + hash }).toString();

                window.location.replace(redirectUrl.href);
            }
        </script>
    </head>

    <body>
        <p>Redirecting...</p>
    </body>
</html>
